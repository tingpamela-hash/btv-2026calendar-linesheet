# Free-tier issue regression suite.
# ubuntu-latest only. No larger or paid runners.
# No repository secrets. Most tests read local files and in-process mocks.
# tests/issue-68-69-rls.test.js also builds a local Postgres and PostgREST.
name: Issue tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  issue-tests:
    name: Issue unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan client files for webhook secrets
        run: npm run scan:secrets

      - name: Install local Postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib
          major=$(psql --version | awk '{print $3}' | cut -d. -f1)
          sudo apt-get install -y "postgresql-${major}-cron"
          sudo pg_ctlcluster "$major" main start

      - name: Run issue unit tests
        run: npm run test:issues

name: Planner Checks
on:
  push:
  pull_request:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Install dependencies
      run: npm ci
    - name: Install local Postgres
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql postgresql-contrib
        major=$(psql --version | awk '{print $3}' | cut -d. -f1)
        sudo apt-get install -y "postgresql-${major}-cron"
        sudo pg_ctlcluster "$major" main start
    - name: Run isolated unit tests
      run: npm test
    - name: Build website assets
      run: npm run build
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: website-build
        path: dist/
        retention-days: 30
    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium
    - name: Run local page checks
      run: npx playwright test --config tests/e2e/playwright.config.js
